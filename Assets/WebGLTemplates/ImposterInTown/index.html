<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{{ PRODUCT_NAME }}}</title>
  <meta name="description" content="Something is wearing the villagers' faces. Find the imposter before midnight.">
  <meta name="theme-color" content="#ffffff">
  <!-- the tab icon: the svg where browsers take it, pngs otherwise; Apple's home screen icon sits on white -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- the card shown when the link is shared. Sites like Discord fetch the image from their own servers, so it
       needs the page's full address: set SITE_URL under Player Settings > Resolution and Presentation
       (e.g. https://example.com/imposter/, with the closing slash) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{{ PRODUCT_NAME }}}">
  <meta property="og:description" content="Something is wearing the villagers' faces. Find the imposter before midnight.">
  <meta property="og:image" content="{{{ SITE_URL }}}share.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Imposter in Town: villagers milling around a fountain in a low-poly town square">
  <meta property="og:url" content="{{{ SITE_URL }}}">
  <meta name="twitter:card" content="summary_large_image">
  <!-- National Park ExtraBold, the same file the game's HUD uses, for the messages shown on phones or when the game can't start -->
  <link rel="preload" href="NationalPark-ExtraBold.ttf" as="font" type="font/ttf" crossorigin>
  <style>
    @font-face {
      font-family: "National Park ExtraBold";
      src: url("NationalPark-ExtraBold.ttf") format("truetype");
      font-weight: normal;
      font-display: swap;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }
    /* the game fills the whole window */
    #game {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      outline: none;
      background: #fff;
    }
    /* white, with the game's sticker bar in the middle filling as the game loads,
       then fades away once the game is ready */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #fff;
      opacity: 1;
      transition: opacity 1.2s ease;
      will-change: opacity;
    }
    #loading.done {
      opacity: 0;
      pointer-events: none;
    }
    /* like the HUD's taken bar (ImposterHud.Meters): a white rounded face with a black outline and a solid
       drop shadow, and a dark pill inside that grows from a round dot */
    #bar {
      width: min(320px, 60vw);
      height: 18px;
      box-sizing: border-box;
      padding: 2.5px;
      background: #fff;
      border: 2.5px solid #000;
      border-radius: 8px;
      box-shadow: 0 3px 0 #000;
    }
    #fill {
      width: 0%;
      min-width: 8px;
      height: 100%;
      border-radius: 4px;
      background: #211c29;
      visibility: hidden;
      transition: width 0.25s ease;
    }
    /* only shown if the game can't start */
    #error {
      display: none;
      color: rgba(0, 0, 0, 0.6);
      font: 18px/1.3 "National Park ExtraBold", sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    /* phones and narrow windows: the game needs a keyboard and mouse, so this covers everything */
    #blocked {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background: #fff;
      color: #211c29;
      font-family: "National Park ExtraBold", sans-serif;
      font-size: 22px;
      line-height: 1.25;
      letter-spacing: 0.04em;
      text-align: center;
      text-transform: uppercase;
      text-wrap: balance;
      z-index: 10;
    }
    @media (max-width: 700px) {
      #blocked { display: flex; }
    }
    body.mobile #blocked { display: flex; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="-1"></canvas>

  <div id="loading">
    <div id="bar"><div id="fill"></div></div>
    <div id="error">This browser couldn't start the game</div>
  </div>

  <div id="blocked">
    <div>Please play on a computer</div>
  </div>

  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const canvas = document.querySelector("#game");
    const loading = document.querySelector("#loading");
    const fill = document.querySelector("#fill");

    //a phone or a narrow window can't play it, so the game isn't downloaded at all there
    const mobile = window.matchMedia("(max-width: 700px), (hover: none) and (pointer: coarse)").matches;

    if (mobile) {
      document.body.classList.add("mobile");
      loading.remove();
    } else {
      //browsers, Safari above all, only allow capturing the mouse, going fullscreen and starting sound from inside the
      //page's own click handler. the game asks for those a moment later from its own loop, which Safari refuses,
      //so the page does them itself, right in the click

      //every sound context the game makes, so a click can wake them up (Safari starts them asleep)
      const audioContexts = [];
      for (const name of ["AudioContext", "webkitAudioContext"]) {
        const Original = window[name];
        if (!Original) continue;
        window[name] = class extends Original {
          constructor(...args) {
            super(...args);
            audioContexts.push(this);
          }
        };
      }
      const wakeAudio = () => audioContexts.forEach((context) => context.state !== "running" && context.resume().catch(() => {}));

      //capturing the mouse never throws an error into the game, which would stop it. if the browser refuses because
      //it wasn't asked from a click, the next click captures it instead
      const nativeLock = canvas.requestPointerLock || canvas.webkitRequestPointerLock;
      const lockNow = () => {
        try {
          const request = nativeLock.call(canvas);
          if (request && request.catch) request.catch(() => {});
        } catch (error) {}
      };
      canvas.requestPointerLock = lockNow;
      if (canvas.webkitRequestPointerLock) canvas.webkitRequestPointerLock = lockNow;
      const locked = () => (document.pointerLockElement || document.webkitPointerLockElement) === canvas;

      const goFullscreen = () => {
        const page = document.documentElement;
        const request = page.requestFullscreen || page.webkitRequestFullscreen;
        if (!request) return;
        try {
          const result = request.call(page);
          if (result && result.catch) result.catch(() => {});
        } catch (error) {}
      };

      let game = null;
      let started = false;
      //the click is on the start screen's PLAY button (see pageBridge.jslib)
      const onPlayButton = (event) => {
        const button = window.imposterPlayButton;
        if (!button) return false;
        const area = canvas.getBoundingClientRect();
        const x = (event.clientX - area.left) / area.width;
        const y = 1 - (event.clientY - area.top) / area.height;
        return x >= button.x && x <= button.x + button.width && y >= button.y && y <= button.y + button.height;
      };

      canvas.addEventListener("pointerdown", (event) => {
        //the keyboard only reaches the game while the canvas has focus
        canvas.focus();
        wakeAudio();
        if (!game) return;
        if (!started && onPlayButton(event)) {
          //PLAY on the start screen: fullscreen, and the round begins. the mouse isn't captured yet: the villagers'
          //gossip comes first and needs the cursor, and the game asks for the mouse once it's over
          started = true;
          goFullscreen();
          game.SendMessage("HUD", "BeginFromPage");
          return;
        }
        //whenever the game wants the mouse, like once the gossip is over, after Esc or on play again (see pageBridge.jslib)
        if (window.imposterWantsPointerLock && !locked()) lockNow();
      });

      createUnityInstance(canvas, {
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        //high resolution screens would render up to four times the pixels, which slows the game down a lot in a browser
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      }, (progress) => {
        //like the HUD's bar, it shows as a round dot as soon as anything has loaded
        fill.style.visibility = progress > 0 ? "visible" : "hidden";
        fill.style.width = Math.round(progress * 100) + "%";
      }).then((instance) => {
        game = instance;
        canvas.focus();
        //the game's first frames are heavy, give it a moment to settle so the fade runs smoothly instead of jumping
        setTimeout(() => {
          loading.classList.add("done");
          loading.addEventListener("transitionend", () => loading.remove(), { once: true });
        }, 500);
      }).catch((message) => {
        fill.style.visibility = "visible";
        fill.style.width = "100%";
        fill.style.background = "#ff6b6b";
        document.querySelector("#error").style.display = "block";
        console.error(message);
      });
    }
  </script>
</body>
</html>
